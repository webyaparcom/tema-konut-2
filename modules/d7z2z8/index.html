  .modulex-konut-kat-cephe-pen--musait { border-color: --accent--; background: --accent--; }
  .modulex-konut-kat-cephe-pen--rezerve { border-style: dashed; border-color: --accentInk--; background: color-mix(in srgb, --accent-- 20%, transparent); }
  .modulex-konut-kat-cephe-pen--satildi { border-color: color-mix(in srgb, --text-- 45%, transparent); background: repeating-linear-gradient(45deg, color-mix(in srgb, --text-- 40%, transparent) 0 2px, transparent 2px 5px); }
  .modulex-konut-kat-cephe-kat[aria-selected="true"] .modulex-konut-kat-cephe-pen--musait { border-color: --vurguText--; }
  .modulex-konut-kat-cephe-zemin { width: 100%; height: 10px; border-radius: 0 0 6px 6px; background: --accent--; }
  .modulex-konut-kat-cephe-paneller { display: grid; gap: 28px; min-width: 0; }
  .modulex-konut-kat-cephe--js .modulex-konut-kat-cephe-kpanel { animation: modulex-konut-kat-cephe-yuksel 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .modulex-konut-kat-cephe-kbas { margin-block-end: 14px; font-family: var(--mx-font-heading, inherit); font-size: 1.5rem; font-weight: 800; }
  .modulex-konut-kat-cephe-daireler { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
  .modulex-konut-kat-cephe-daire { display: grid; align-content: start; gap: 10px; padding: 18px; border: 1px solid --cizgi--; border-block-start: 5px solid --accent--; border-radius: --yuvarlak--; background: --kartBg--; transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .modulex-konut-kat-cephe-daire:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -24px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-konut-kat-cephe-daire[data-d="rezerve"] { border-block-start-style: dashed; border-block-start-color: --accentInk--; }
  .modulex-konut-kat-cephe-daire[data-d="satildi"] { border-block-start-color: color-mix(in srgb, --text-- 35%, transparent); }
  .modulex-konut-kat-cephe--musait .modulex-konut-kat-cephe-daire:not([data-d="musait"]) { display: none; }
  .modulex-konut-kat-cephe-dust { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

  .modulex-konut-kat-cephe-durum--musait { background: --accent--; color: --accentText--; }
  .modulex-konut-kat-cephe-durum--rezerve { border: 1.5px dashed --accentInk--; color: --accentInk--; }
  .modulex-konut-kat-cephe-durum--satildi { background: color-mix(in srgb, --text-- 10%, transparent); color: --text--; text-decoration: line-through; }
  .modulex-konut-kat-cephe-ozellik { display: flex; flex-wrap: wrap; gap: 6px 14px; color: --muted--; font-size: 0.9rem; }
  .modulex-konut-kat-cephe-ozellik li { display: inline-flex; align-items: center; gap: 5px; }
  .modulex-konut-kat-cephe-oik { color: --accentInk--; font-size: 18px; }

  .modulex-konut-kat-cephe-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-konut-kat-cephe :is(.modulex-konut-kat-cephe-baslik, .modulex-konut-kat-cephe-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-konut-kat-cephe-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-konut-kat-cephe { padding-inline: 16px; }

  @media (prefers-reduced-motion: reduce) {
    .modulex-konut-kat-cephe *, .modulex-konut-kat-cephe *::before, .modulex-konut-kat-cephe *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-konut-kat-cephe";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const katSec = (s, P) => {
        const t = [...s.querySelectorAll("[data-kat]")];
        const yal = s.querySelector("[data-yalniz]");
        if (yal) {
          const l = yal.closest("label");
          if (l) l.hidden = false;
          yal.addEventListener("change", () => s.classList.toggle(P + "--musait", yal.checked));
        }
        if (t.length < 2) return;
        s.classList.add(P + "--js");
        const p = t.map((a) => document.getElementById(a.getAttribute("aria-controls")));
        const sec = (i, odak) => {
          t.forEach((a, j) => { a.setAttribute("aria-selected", String(j === i)); a.tabIndex = j === i ? 0 : -1; });
          p.forEach((x, j) => { if (x) x.hidden = j !== i; });
          if (odak) t[i].focus();
        };
        t.forEach((a, i) => {
          a.addEventListener("click", (e) => { e.preventDefault(); sec(i); });
          a.addEventListener("keydown", (e) => {
            let n = null;
            if (e.key === "ArrowUp") n = i - 1;
            else if (e.key === "ArrowDown") n = i + 1;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n === null) return;
            e.preventDefault();
            sec((n + t.length) % t.length, true);
          });
        });
        sec(Math.max(0, t.findIndex((a) => a.dataset.musait === "1")));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      katSec(s, P, az);
    });
  })();
</script>
