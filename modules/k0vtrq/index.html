<section class="modulex-sayac-pano-kanat{{fbsinif}}" {{fbetiket}}>

<style>
  /* sayac-pano-kanat — sayac-odometre haneleri kutucukta 0'dan sayar, sayac-fis noktalı önderli döküm listesidir; bu modül kalkış panosu iskeleti kurar — her karakter ayrı kanat hücresi (rotateX takla), satır başı ikon kutusu, durum ışığı ve vurgulu «şimdi» satırı (cihaz kuyruğu / sıra panosu dili). */
  .modulex-sayac-pano-kanat { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-sayac-pano-kanat *, .modulex-sayac-pano-kanat *::before, .modulex-sayac-pano-kanat *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-sayac-pano-kanat :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-sayac-pano-kanat :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-sayac-pano-kanat :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-sayac-pano-kanat :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-sayac-pano-kanat img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-sayac-pano-kanat) img { height: auto; }
  .modulex-sayac-pano-kanat [hidden] { display: none !important; }
  .modulex-sayac-pano-kanat :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-sayac-pano-kanat :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-sayac-pano-kanat-ic { max-width: --max--; margin-inline: auto; }
  .modulex-sayac-pano-kanat-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-sayac-pano-kanat--bassiz .modulex-sayac-pano-kanat-bas { display: none; }
  .modulex-sayac-pano-kanat-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-sayac-pano-kanat-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-sayac-pano-kanat-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-sayac-pano-kanat-bas { max-width: 760px; }
  .modulex-sayac-pano-kanat-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-sayac-pano-kanat-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-sayac-pano-kanat-dugme:hover { transform: translateY(-2px); }
  .modulex-sayac-pano-kanat-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-sayac-pano-kanat-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-sayac-pano-kanat-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-sayac-pano-kanat-pano { position: relative; padding: clamp(14px, 2.4vw, 28px); border: 6px solid color-mix(in srgb, --text-- 14%, transparent); border-radius: 16px; background: color-mix(in srgb, --bg-- 92%, --text--); box-shadow: inset 0 2px 0 color-mix(in srgb, --text-- 10%, transparent), 0 40px 70px -40px color-mix(in srgb, --accent-- 40%, transparent); }
  .modulex-sayac-pano-kanat-pano-cerceve { display: flex; align-items: center; gap: 12px; margin-block-end: 6px; padding-block-end: 14px; border-block-end: 1px solid --cizgi--; }
  .modulex-sayac-pano-kanat-vida { flex: none; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, --muted--, color-mix(in srgb, --text-- 20%, transparent)); }
  .modulex-sayac-pano-kanat-lambalar { flex: 1; height: 6px; background: radial-gradient(circle, color-mix(in srgb, --accent-- 70%, transparent) 2px, transparent 2.5px) 0 50% / 14px 6px repeat-x; }
  .modulex-sayac-pano-kanat-satir { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto 14px; align-items: center; gap: 16px; padding: 16px 12px; border-block-end: 1px dashed --cizgi--; transition: background 0.25s ease; }
  .modulex-sayac-pano-kanat-satir:last-child { border-block-end: 0; }
  .modulex-sayac-pano-kanat-satir:hover { background: color-mix(in srgb, --text-- 5%, transparent); }
  .modulex-sayac-pano-kanat-satir--simdi { box-shadow: inset 4px 0 0 --accent--; }
  [dir="rtl"] .modulex-sayac-pano-kanat-satir--simdi { box-shadow: inset -4px 0 0 --accent--; }
  .modulex-sayac-pano-kanat-ikon { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px; background: color-mix(in srgb, --accent-- 22%, transparent); color: --accentInk--; font-size: 22px; }
  .modulex-sayac-pano-kanat-etiket { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; line-height: 1.3; text-transform: uppercase; }
  .modulex-sayac-pano-kanat-not { color: --muted--; font-size: 0.86rem; }
  .modulex-sayac-pano-kanat-deger { justify-self: end; }
  .modulex-sayac-pano-kanat-hucreler { display: inline-flex; gap: 4px; perspective: 400px; }
  .modulex-sayac-pano-kanat-kanat { position: relative; display: inline-grid; place-items: center; min-width: 1.3em; height: 1.65em; padding-inline: 2px; border-radius: 5px; background: linear-gradient(to bottom, color-mix(in srgb, --text-- 17%, --bg--) calc(50% - 1px), color-mix(in srgb, --bg-- 92%, --text--) calc(50% - 1px) calc(50% + 1px), color-mix(in srgb, --text-- 11%, --bg--) calc(50% + 1px)), color-mix(in srgb, --text-- 14%, --bg--); box-shadow: inset 0 -2px 0 color-mix(in srgb, --bg-- 40%, transparent); color: --text--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 700; line-height: 1; transition: transform 0.55s cubic-bezier(0.3, 1.5, 0.6, 1); transition-delay: calc(var(--i) * 0.12s + var(--c) * 0.07s); }
  .modulex-sayac-pano-kanat-kanat--bos { min-width: 0.5em; background: transparent; box-shadow: none; }
  .modulex-sayac-pano-kanat--hazir:not(.modulex-sayac-pano-kanat--gor) .modulex-sayac-pano-kanat-kanat { transform: rotateX(-90deg); }
  .modulex-sayac-pano-kanat-isik { width: 12px; height: 12px; border-radius: 50%; background: color-mix(in srgb, --text-- 25%, transparent); }
  .modulex-sayac-pano-kanat-satir--simdi .modulex-sayac-pano-kanat-isik { background: --accent--; box-shadow: 0 0 10px --accent--; animation: modulex-sayac-pano-kanat-isik 1.6s ease-in-out 3; }
  @keyframes modulex-sayac-pano-kanat-isik { 50% { opacity: 0.3; } }
  .modulex-sayac-pano-kanat-gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (max-width: 768px) {
    .modulex-sayac-pano-kanat-satir { grid-template-columns: 40px minmax(0, 1fr) 12px; gap: 10px 12px; padding-inline: 6px; }
    .modulex-sayac-pano-kanat-deger { grid-column: 2 / -1; grid-row: 2; justify-self: start; }
    .modulex-sayac-pano-kanat-ikon { width: 40px; height: 40px; }
    .modulex-sayac-pano-kanat-kanat { font-size: 1.3rem; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-pano-kanat :is(.modulex-sayac-pano-kanat-baslik, .modulex-sayac-pano-kanat-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-sayac-pano-kanat-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-sayac-pano-kanat { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-sayac-pano-kanat *, .modulex-sayac-pano-kanat *::before, .modulex-sayac-pano-kanat *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-sayac-pano-kanat";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
